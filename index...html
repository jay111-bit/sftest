<title>Messaging Test Page</title>
<style>
  html, body { height: 100%; margin: 0; background: #ffffff; }
  #err {
    display: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px; color: #842029; background: #f8d7da;
    padding: 10px 14px; margin: 20px; border-radius: 6px;
  }
</style>

<body>

<div id="err"></div>

<script type='text/javascript'>
  function initEmbeddedMessaging() {
    try {
      embeddedservice_bootstrap.settings.language = 'en_US';
      embeddedservice_bootstrap.init(
        '00Dfj00000fBbSr',
        'SSRF_Test_Channel',
        'https://orgfarm-e14b4050df-dev-ed.develop.my.site.com/ESWSSRFTestChannel1788961250696',
        {
          scrt2URL: 'https://orgfarm-e14b4050df-dev-ed.develop.my.salesforce-scrt.com'
        }
      );
    } catch (err) {
      console.error('Error loading Embedded Messaging: ', err);
      var e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent = 'Failed to initialise: ' + err.message;
    }
  };

  window.addEventListener('load', function () {
    setTimeout(function () {
      if (typeof embeddedservice_bootstrap === 'undefined') {
        var e = document.getElementById('err');
        e.style.display = 'block';
        e.textContent = 'bootstrap.min.js did not load. Check that this page origin is in the CORS allowed origins list.';
      }
    }, 8000);
  });
</script>
<script type='text/javascript'
        src='https://orgfarm-e14b4050df-dev-ed.develop.my.site.com/ESWSSRFTestChannel1788961250696/assets/js/bootstrap.min.js'
        onload='initEmbeddedMessaging()'></script>
